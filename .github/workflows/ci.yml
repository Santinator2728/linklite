name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            services/*/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Unit tests with coverage (pytest, threshold 80%)
        run: pytest --cov --cov-report=term --cov-report=xml --junitxml=test-results.xml

      - name: Upload coverage and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            coverage.xml
            test-results.xml

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep scan (fails on ERROR findings)
        run: >
          semgrep scan
          --config p/python
          --config p/owasp-top-ten
          --config p/dockerfile
          --severity ERROR
          --error
          --sarif --output semgrep.sarif

      - name: Upload results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  build-and-smoke-test:
    name: Build images and smoke test
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the system (docker compose)
        run: docker compose up --build --detach --wait --wait-timeout 120

      - name: Smoke test – create a link and follow it
        run: |
          set -euo pipefail
          code=$(curl -fsS -X POST localhost:8001/links \
            -H 'Content-Type: application/json' \
            -d '{"url": "https://example.com/tutorial"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["code"])')
          echo "Created short code: $code"

          location=$(curl -fsS -o /dev/null -w '%{redirect_url}' "localhost:8000/$code")
          test "$location" = "https://example.com/tutorial"

          clicks=$(curl -fsS "localhost:8003/stats/$code" | python3 -c 'import json,sys; print(json.load(sys.stdin)["total_clicks"])')
          test "$clicks" = "1"

          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8001/links \
            -H 'Content-Type: application/json' -d '{"url": "javascript:alert(1)"}')
          test "$status" = "422"
          echo "Smoke test passed"

      - name: Service logs
        if: always()
        run: docker compose logs

      - name: Stop the system
        if: always()
        run: docker compose down --volumes

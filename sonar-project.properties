# SonarCloud analysis (quality gate, see Jira XP-28).
# The organization and project keys come from SonarCloud when the repository is imported.
sonar.organization=santinator2728
sonar.projectKey=Santinator2728_linklite
sonar.projectName=LinkLite

sonar.sources=services,tests/system
sonar.exclusions=services/*/tests/**
sonar.tests=services
sonar.test.inclusions=services/*/tests/**

sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml

# Fail the CI job when the quality gate fails, instead of only reporting it.
sonar.qualitygate.wait=true

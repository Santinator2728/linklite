[project]
name = "linklite"
version = "0.1.0"
description = "URL shortener with click analytics (X-Ops course project)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"services/*/tests/*" = ["S101"]  # assert is how pytest works
"ai-gates/*/test_*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["link_service", "redirect_service", "analytics_service", "review"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["services/link", "services/redirect", "services/analytics", "ai-gates/code-review"]
testpaths = ["services", "ai-gates"]

[tool.coverage.run]
source = ["services", "ai-gates"]
omit = ["services/*/tests/*", "ai-gates/*/test_*.py"]
relative_files = true

[tool.coverage.report]
fail_under = 80
show_missing = true
